name: Validate and Export ADF Templates
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Installs Node and the npm packages saved in your package.json file in the build
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: install ADF Utilities package
        run: npm install
        working-directory: ${{github.workspace}}/build # (1) provide the folder location of the package.json file

      # Validates all of the Data Factory resources in the repository. You'll get the same validation errors as when "Validate All" is selected.
      - name: Validate
        run: npm run build validate ${{github.workspace}}/ /subscriptions/9a4ab8f0-edfb-441d-8ca4-1f7e2bff7866/resourceGroups/rg-dev-cicd-south-india/providers/Microsoft.DataFactory/factories/adf-dev-cicd-south-india # (2) The validate command needs the root folder location of your repository where all the objects are stored. And the 2nd parameter is the resourceID of the ADF instance
        working-directory: ${{github.workspace}}/build

      - name: Validate and Generate ARM template
        run: npm run build export ${{github.workspace}}/ /subscriptions/9a4ab8f0-edfb-441d-8ca4-1f7e2bff7866/resourceGroups/rg-dev-cicd-south-india/providers/Microsoft.DataFactory/factories/adf-dev-cicd-south-india "ExportedArmTemplate" # (3) The build command, as validate, needs the root folder location of your repository where all the objects are stored. And the 2nd parameter is the resourceID of the ADF instance. The 3rd parameter is the exported ARM template artifact name
        working-directory: ${{github.workspace}}/build

      # In order to leverage the artifact in another job, we
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExportedArmTemplate # (4) use the same artifact name you used in the previous export step
          path: ${{github.workspace}}/build/ExportedArmTemplate
