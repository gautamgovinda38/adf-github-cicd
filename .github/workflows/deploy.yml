name: Deploy ADF Templates
on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Deployment environment"
                required: true
                default: "test"
                # type: choice
                # options:
                #     - test
                #     - production
permissions:
    id-token: write
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
      # Installs Node and the npm packages saved in your package.json file in the build
            - name: Setup Node.js environment
              uses: actions/setup-node@v4
              with:
               node-version: 22.x

            - name: install ADF Utilities package
              run: npm install
              working-directory: ${{github.workspace}}/build # (1) provide the folder location of the package.json file
            
            - name: Validate and Generate ARM template
              run: npm run build export ${{github.workspace}}/ /subscriptions/9a4ab8f0-edfb-441d-8ca4-1f7e2bff7866/resourceGroups/rg-dev-cicd-south-india/providers/Microsoft.DataFactory/factories/adf-dev-cicd-south-india "ExportedArmTemplate" # (3) The build command, as validate, needs the root folder location of your repository where all the objects are stored. And the 2nd parameter is the resourceID of the ADF instance. The 3rd parameter is the exported ARM template artifact name
              working-directory: ${{github.workspace}}/build

            - name: Login via Az module
              uses: azure/login@v1
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  enable-AzPSSession: true

            - name: data-factory-deploy
              uses: Azure/data-factory-deploy-action@v1.2.0
              with:
                  resourceGroupName: rg-test-cicd-south-india
                  dataFactoryName: adf-test-cicd-south-india
                  armTemplateFile: ARMTemplateForFactory.json
                  armTemplateParametersFile: ARMTemplateParametersForFactory.json
                  additionalParameters: ls_az_data_lake_properties_typeProperties_baseUrl=https://akv-adf-test-cicd.vault.azure.net/ ls_az_datalake_kv_properties_typeProperties_url=https://dltestcicd.dfs.core.windows.net

                  # skipAzModuleInstallation:  # Parameters which skip the Az module installation. Optional, default is false.
